<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance System</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
padding:20px;
}

.container{
max-width:420px;
background:white;
margin:auto;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:6px;
border:1px solid #ccc;
font-size:16px;
}

button{
background:#007bff;
color:white;
border:none;
}

video{
width:100%;
margin-top:10px;
border-radius:8px;
}

#preview{
width:100%;
margin-top:10px;
border-radius:8px;
display:none;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:white;
display:none;
justify-content:center;
align-items:center;
text-align:center;
font-size:28px;
font-weight:bold;
z-index:999;
padding:20px;
}

</style>

</head>

<body>

<div class="container">

<h2>Employee Attendance</h2>

<select id="name">

<option value="">Select Employee</option>

<option value="Sagar Bala">Sagar Bala</option>
<option value="Nikunja Ghosh">Nikunja Ghosh</option>
<option value="Dipan">Dipan</option>
<option value="Jhuma Das">Jhuma Das</option>

<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>

</select>

<select id="action">

<option value="">Select Action</option>

<option value="entry">Entry</option>
<option value="tiffin_exit">Tiffin Exit</option>
<option value="tiffin_entry">Tiffin Entry</option>
<option value="exit">Exit</option>

</select>

<button onclick="verifyLocation()">📍 Verify Location</button>

<div id="locStatus">Location Not Verified</div>

<video id="video" autoplay playsinline></video>

<img id="preview">

<button onclick="captureSelfie()">📷 Capture Selfie</button>

<button onclick="submitAttendance()">Submit Attendance</button>

</div>

<div id="resultScreen" class="overlay"></div>

<script>

const officeLat = 23.23347531928216
const officeLon = 87.8657818187088
const allowedDistance = 200

let verified=false
let imageData=""
let stream=null

startCamera()

function startCamera(){

navigator.mediaDevices.getUserMedia({video:true})

.then(function(s){

stream=s
document.getElementById("video").srcObject=s

})

.catch(function(){

alert("Camera permission denied")

})

}

function verifyLocation(){

navigator.geolocation.getCurrentPosition(

function(pos){

let lat=pos.coords.latitude
let lon=pos.coords.longitude

let distance=getDistance(lat,lon,officeLat,officeLon)

if(distance<allowedDistance){

verified=true
document.getElementById("locStatus").innerHTML="✔ Location Verified"

}else{

document.getElementById("locStatus").innerHTML="❌ Outside Office"

}

},

function(){

alert("Location permission denied")

}

)

}

function getDistance(lat1,lon1,lat2,lon2){

const R=6371

const dLat=(lat2-lat1)*Math.PI/180
const dLon=(lon2-lon1)*Math.PI/180

const a=
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2)

const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))

return R*c*1000

}

function captureSelfie(){

let video=document.getElementById("video")

let canvas=document.createElement("canvas")

canvas.width=video.videoWidth
canvas.height=video.videoHeight

canvas.getContext("2d").drawImage(video,0,0)

imageData=canvas.toDataURL("image/png")

document.getElementById("preview").src=imageData
document.getElementById("preview").style.display="block"

video.style.display="none"

}

function submitAttendance(){

let name=document.getElementById("name").value
let action=document.getElementById("action").value

if(name==""){

alert("Select Employee")
return

}

if(action==""){

alert("Select Action")
return

}

if(!verified){

alert("Verify Location First")
return

}

if(imageData==""){

alert("Capture Selfie First")
return

}

fetch("https://script.google.com/macros/s/AKfycbwWpLrbZjlrFskVrAjS3o23Arwat0o5nzmuWtpOqqBVo1BKkaNpBVbexQumvMGTBfgD/exec",{

method:"POST",

body:JSON.stringify({

name:name,
type:action,
image:imageData

})

})

.then(res=>res.text())

.then(res=>{

let screen=document.getElementById("resultScreen")

screen.style.display="flex"

if(res.toLowerCase().includes("already")){

screen.innerHTML="🚫 Your attendance already submitted"

}else{

screen.innerHTML="✅ "+name+"<br>Attendance Successfully Submitted"

}

stopCamera()

})

.catch(function(){

alert("Submit failed")

})

}

function stopCamera(){

if(stream){

stream.getTracks().forEach(track=>track.stop())

}

}

</script>

</body>
</html>
