<!DOCTYPE html>
<html>
<head>

<title>Attendance</title>

<style>

body{
margin:0;
font-family:Arial;
background:#111;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:100%;
max-width:500px;
text-align:center;
}

select{
width:80%;
padding:12px;
margin:10px;
font-size:16px;
border-radius:6px;
}

video{
width:90%;
border-radius:10px;
margin-top:15px;
}

button{
padding:12px 20px;
margin-top:15px;
font-size:16px;
border:none;
border-radius:6px;
background:#27ae60;
color:white;
cursor:pointer;
}

.status{
margin-top:10px;
font-size:16px;
}

#result{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#111;
display:none;
justify-content:center;
align-items:center;
text-align:center;
font-size:32px;
}

</style>

</head>

<body>

<div class="container">

<h2>Employee Attendance</h2>

<select id="employee">

<option>Sagar Bala</option>
<option>Nikunja Ghosh</option>

</select>

<select id="action">

<option>Entry</option>
<option>Tiffin Exit</option>
<option>Tiffin Entry</option>
<option>Exit</option>

</select>

<div class="status" id="locationStatus">
Checking location...
</div>

<video id="video" autoplay></video>

<button onclick="capture()">Capture Selfie</button>

<button onclick="submitAttendance()">Submit</button>

<canvas id="canvas" style="display:none"></canvas>

</div>

<div id="result"></div>

<script>

const OFFICE_LAT = 23.233475869351345;
const OFFICE_LON = 87.86578472386672;
const RADIUS = 100;

let imageData="";
let locationValid=false;

const video=document.getElementById("video");

navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{
video.srcObject=stream;
});

navigator.geolocation.getCurrentPosition(function(pos){

let lat=pos.coords.latitude;
let lon=pos.coords.longitude;

let dist=getDistance(lat,lon,OFFICE_LAT,OFFICE_LON);

if(dist<RADIUS){

document.getElementById("locationStatus").innerHTML="Location Approved";
locationValid=true;

}else{

document.getElementById("locationStatus").innerHTML="Location Invalid";

}

});

function getDistance(lat1,lon1,lat2,lon2){

var R = 6371000;

var dLat = (lat2-lat1) * Math.PI/180;
var dLon = (lon2-lon1) * Math.PI/180;

var a =
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2);

var c = 2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

return R*c;

}

function capture(){

let canvas=document.getElementById("canvas");

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

canvas.getContext("2d").drawImage(video,0,0);

imageData=canvas.toDataURL("image/png");

}

function submitAttendance(){

if(!locationValid){

alert("Location not approved");
return;

}

if(!imageData){

alert("Capture selfie first");
return;

}

let employee=document.getElementById("employee").value;
let action=document.getElementById("action").value;

let now=new Date();

let time=now.toLocaleTimeString();
let date=now.toISOString().split('T')[0];

fetch("https://script.google.com/macros/s/AKfycbyGg3CKPphQFQqgRtY6ukBVA7BjkZrFHP8xjSzilcSAnxihy-5N74a8igmnLBZF1FMi/exec",{

method:"POST",

body:new URLSearchParams({

employee:employee,
action:action,
time:time,
date:date,
image:imageData

})

})

.then(res=>res.text())
.then(data=>{

let result=document.getElementById("result");

if(data=="ALREADY"){

result.innerHTML=employee+"<br>Your action is already submitted";

}else{

result.innerHTML=employee+"<br>Your action is submitted";

}

result.style.display="flex";

});

}

</script>

</body>

</html>
