<!DOCTYPE html>
<html>
<head>

<title>Attendance</title>

<style>

body{
font-family:Arial;
text-align:center;
}

button{
padding:10px;
margin:5px;
}

#msg{
font-size:20px;
margin-top:20px;
}

</style>

</head>

<body>

<h2>Employee Attendance</h2>

<select id="emp">

<option>Sagar Bala</option>
<option>Nikunja Ghosh</option>
<option>Dipan</option>
<option>Jhuma Das</option>

</select>

<br><br>

<select id="action">

<option value="entry">Entry</option>
<option value="tiffin_exit">Tiffin Exit</option>
<option value="tiffin_entry">Tiffin Entry</option>
<option value="exit">Exit</option>

</select>

<br><br>

<video id="video" width="300" autoplay></video>

<br><br>

<button onclick="capture()">Submit</button>

<p id="msg"></p>

<script>

const scriptURL="https://script.google.com/macros/s/AKfycbz_H2vh5ytsooFy2EtkZorbzSD6Uad4N8uEYGtNvkL5vC5r_cVWpYj5wdO4HXP3fz3j/exec";

navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{
document.getElementById("video").srcObject=stream;
});

function capture(){

var emp=document.getElementById("emp").value;
var action=document.getElementById("action").value;

var video=document.getElementById("video");

var canvas=document.createElement("canvas");
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

var ctx=canvas.getContext("2d");
ctx.drawImage(video,0,0);

var image=canvas.toDataURL("image/jpeg");

fetch(scriptURL,{
method:"POST",
body:new URLSearchParams({
emp:emp,
action:action,
image:image
})
})
.then(res=>res.text())
.then(data=>{

document.getElementById("msg").innerHTML="Your attendance successfully submitted";

});

}

</script>

</body>
</html>
