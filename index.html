<!DOCTYPE html>
<html>
<head>

<title>Employee Attendance</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding:40px;
}

.container{
background:white;
padding:30px;
border-radius:10px;
width:350px;
margin:auto;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{
margin-bottom:20px;
}

select,button{
width:100%;
padding:10px;
margin:10px 0;
font-size:16px;
}

video{
width:100%;
border-radius:10px;
}

#msg{
margin-top:20px;
font-size:18px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>Attendance System</h2>

<select id="emp">

<option>Sagar Bala</option>
<option>Nikunja Ghosh</option>
<option>Dipan</option>
<option>Jhuma Das</option>

</select>

<select id="action">

<option value="entry">Entry</option>
<option value="tiffin_exit">Tiffin Exit</option>
<option value="tiffin_entry">Tiffin Entry</option>
<option value="exit">Exit</option>

</select>

<video id="video" autoplay></video>

<button onclick="submitAttendance()">Submit Attendance</button>

<div id="msg"></div>

</div>

<script>

const scriptURL="https://script.google.com/macros/s/AKfycbzP0-GGlwVVAbsEpqvA62P-qUD3LvOYWBUJG9kLC_MXuTv5ngcYT5NKXa4Xe1cDBm2F/exec";

const video=document.getElementById("video");

navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{
video.srcObject=stream;
});

function submitAttendance(){

var emp=document.getElementById("emp").value;
var action=document.getElementById("action").value;

var canvas=document.createElement("canvas");
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

var ctx=canvas.getContext("2d");
ctx.drawImage(video,0,0);

var image=canvas.toDataURL("image/jpeg");

fetch(scriptURL,{
method:"POST",
body:new URLSearchParams({
emp:emp,
action:action,
image:image
})
})
.then(res=>res.text())
.then(data=>{

document.getElementById("msg").innerHTML=
"✅ Your attendance successfully submitted";

})
.catch(err=>{

document.getElementById("msg").innerHTML=
"❌ Submit failed";

});

}

</script>

</body>
</html>
