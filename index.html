<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>QR Attendance System</title>

<style>

body{
font-family:Arial;
background:#f2f4f7;
padding:20px;
}

.container{
max-width:420px;
background:white;
margin:auto;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.15);
}

h2{text-align:center;}

select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:6px;
border:1px solid #ccc;
font-size:16px;
}

button{
background:#007bff;
color:white;
border:none;
}

video{
width:100%;
border-radius:8px;
margin-top:10px;
}

canvas{
display:none;
}

.status{
margin-top:10px;
text-align:center;
font-weight:bold;
}

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:flex;
align-items:center;
justify-content:center;
}

.popup-box{
background:white;
padding:25px;
border-radius:10px;
text-align:center;
width:300px;
}

</style>

</head>

<body>

<div id="permissionPopup" class="popup">

<div class="popup-box">

<h3>Permission Required</h3>

<p>
Allow Camera & Location to mark attendance
</p>

<button onclick="requestPermissions()">
Allow Permissions
</button>

</div>

</div>

<div class="container">

<h2>Employee Attendance</h2>

<select id="name">

<option value="">Select Employee</option>
<option>Sagar Bala</option>
<option>Nikunja Ghosh</option>
<option>Dipan</option>
<option>Jhuma Das</option>

</select>

<select id="action">

<option value="">Select Action</option>
<option>Entry</option>
<option>Tiffin Exit</option>
<option>Tiffin Entry</option>
<option>Exit</option>

</select>

<button onclick="verifyLocation()">📍 Verify Location</button>

<div id="locStatus" class="status">
Location Not Verified
</div>

<video id="video" autoplay playsinline></video>

<button onclick="capture()">📷 Capture Selfie</button>

<canvas id="canvas"></canvas>

<button id="submitBtn" onclick="submitForm()" disabled>
Submit Attendance
</button>

<div id="msg" class="status"></div>

</div>

<script>

const officeLat = 23.233469745356075,
const officeLon = 87.86578447068129
const allowedDistance = 150

let imageData=""
let verified=false

function requestPermissions(){

navigator.mediaDevices.getUserMedia({
video:true,
audio:false
})
.then(function(stream){

document.getElementById("video").srcObject = stream

document.getElementById("permissionPopup").style.display="none"

})
.catch(function(){

alert("Camera permission denied")

})

navigator.geolocation.getCurrentPosition(
function(){},
function(){
alert("Location permission denied")
})

}

function getDistance(lat1,lon1,lat2,lon2){

const R=6371

const dLat=(lat2-lat1)*Math.PI/180
const dLon=(lon2-lon1)*Math.PI/180

const a=
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2)

const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))

return R*c*1000

}

function verifyLocation(){

navigator.geolocation.getCurrentPosition(

function(pos){

let lat=pos.coords.latitude
let lon=pos.coords.longitude

let distance=getDistance(lat,lon,officeLat,officeLon)

if(distance<allowedDistance){

verified=true

document.getElementById("locStatus").innerHTML=
"✔ Location Verified"

document.getElementById("submitBtn").disabled=false

}else{

document.getElementById("locStatus").innerHTML=
"❌ Outside Office"

}

},

function(){

alert("Location access denied")

})

}

function capture(){

let video=document.getElementById("video")
let canvas=document.getElementById("canvas")

canvas.width=video.videoWidth
canvas.height=video.videoHeight

canvas.getContext("2d").drawImage(video,0,0)

imageData=canvas.toDataURL("image/png")

alert("Selfie Captured")

}

function submitForm(){

let name=document.getElementById("name").value
let action=document.getElementById("action").value

if(name==""||action==""){

alert("Select employee and action")

return

}

if(!verified){

alert("Verify location first")

return

}

if(imageData==""){

alert("Capture selfie first")

return

}

let data={
name:name,
action:action,
image:imageData
}

fetch("https://script.google.com/macros/s/AKfycbyCLoooLczP-Z3ItSwdPTvEugjWKRhh7U7KYommitnd8rWotdlHU4pOYDmaQwW_dP-W/exec",{

method:"POST",
body:JSON.stringify(data)

})
.then(res=>res.text())
.then(res=>{

document.getElementById("msg").innerHTML=
"✔ Attendance Submitted"

})

}

</script>

</body>
</html>
