<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Attendance System</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
padding:20px;
}

.container{
max-width:420px;
background:white;
margin:auto;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{text-align:center;}

select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:6px;
border:1px solid #ccc;
font-size:16px;
}

button{
background:#007bff;
color:white;
border:none;
}

video{
width:100%;
margin-top:10px;
border-radius:8px;
}

#preview{
width:100%;
margin-top:10px;
border-radius:8px;
display:none;
}

.status{
margin-top:10px;
text-align:center;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>Employee Attendance</h2>

<select id="name">

<option value="">Select Employee</option>

<option>Sagar Bala</option>
<option>Nikunja Ghosh</option>
<option>Dipan</option>
<option>Jhuma Das</option>

<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>

</select>

<select id="action">

<option value="">Select Action</option>

<option>Entry</option>
<option>Tiffin Exit</option>
<option>Tiffin Entry</option>
<option>Exit</option>

</select>

<button onclick="verifyLocation()">📍 Verify Location</button>

<div id="locStatus" class="status">

Location Not Verified

</div>

<video id="video" autoplay playsinline></video>

<img id="preview">

<button onclick="captureSelfie()">📷 Capture Selfie</button>

<button onclick="submitAttendance()">Submit Attendance</button>

<div id="msg" class="status"></div>

</div>

<script>

const officeLat = 23.23347531928216
const officeLon = 87.8657818187088 
const allowedDistance = 200

let verified=false
let imageData=""
let stream=null

startCamera()

function startCamera(){

navigator.mediaDevices.getUserMedia({video:true})

.then(function(s){

stream=s

document.getElementById("video").srcObject=s

})

.catch(function(){

alert("Camera permission denied")

})

}

function verifyLocation(){

navigator.geolocation.getCurrentPosition(

function(pos){

let lat=pos.coords.latitude
let lon=pos.coords.longitude

let distance=getDistance(lat,lon,officeLat,officeLon)

if(distance<allowedDistance){

verified=true

document.getElementById("locStatus").innerHTML="✔ Location Verified"

}else{

document.getElementById("locStatus").innerHTML="❌ Outside Office"

}

},

function(){

alert("Location permission denied")

},

{enableHighAccuracy:true,timeout:5000}

)

}

function getDistance(lat1,lon1,lat2,lon2){

const R=6371

const dLat=(lat2-lat1)*Math.PI/180
const dLon=(lon2-lon1)*Math.PI/180

const a=
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2)

const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))

return R*c*1000

}

function captureSelfie(){

let video=document.getElementById("video")

let canvas=document.createElement("canvas")

canvas.width=video.videoWidth
canvas.height=video.videoHeight

canvas.getContext("2d").drawImage(video,0,0)

imageData=canvas.toDataURL("image/png")

document.getElementById("preview").src=imageData
document.getElementById("preview").style.display="block"

video.style.display="none"

}

function submitAttendance(){

let name=document.getElementById("name").value
let action=document.getElementById("action").value

if(name==""){

alert("Select Employee")

return

}

if(action==""){

alert("Select Action")

return

}

if(!verified){

alert("Verify Location First")

return

}

if(imageData==""){

alert("Capture Selfie First")

return

}

fetch("https://script.google.com/macros/s/AKfycbxvr3fPj_Qm194DEPOdamyXpbsH2v0-gzSk4T5TS2MiolkxI4oHdv9V9tVTN-O7TG-d/exec",{

method:"POST",

body:JSON.stringify({

name:name,
action:action,
image:imageData

})

})

.then(res=>res.text())

.then(res=>{

document.getElementById("msg").innerHTML=

name + " Your attendance complete"

if(stream){

stream.getTracks().forEach(track=>track.stop())

}

})

.catch(function(){

alert("Submit failed")

})

}

</script>

</body>
</html>
