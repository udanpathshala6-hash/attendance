<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Attendance</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:100%;
max-width:420px;
text-align:center;
padding:20px;
}

select{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
font-size:16px;
border:none;
}

video{
width:100%;
margin-top:15px;
border-radius:10px;
}

#preview{
width:100%;
margin-top:10px;
border-radius:10px;
display:none;
}

button{
width:100%;
padding:14px;
margin-top:15px;
border-radius:10px;
border:none;
background:#22c55e;
color:white;
font-size:16px;
cursor:pointer;
}

.status{
margin-top:10px;
}

#result{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0f172a;
display:none;
justify-content:center;
align-items:center;
text-align:center;
font-size:30px;
padding:20px;
}

</style>

</head>

<body>

<div class="container">

<h2>Employee Attendance</h2>

<select id="employee">

<option>Sagar Bala</option>
<option>Nikunja Ghosh</option>

</select>

<select id="action">

<option>Entry</option>
<option>Tiffin Exit</option>
<option>Tiffin Entry</option>
<option>Exit</option>

</select>

<div id="locationStatus" class="status">
Checking location...
</div>

<video id="video" autoplay playsinline></video>

<img id="preview">

<button onclick="capture()">Capture Selfie</button>

<button onclick="submitAttendance()">Submit Attendance</button>

<canvas id="canvas" style="display:none"></canvas>

</div>

<div id="result"></div>

<script>

const OFFICE_LAT = 23.233703051552062;
const OFFICE_LON = 87.86574516696813;
const RADIUS = 00;

let imageData="";
let locationApproved=false;

const video=document.getElementById("video");

navigator.mediaDevices.getUserMedia({
video:{facingMode:"user"}
})

.then(stream=>{
video.srcObject=stream;
})
.catch(()=>{
alert("Camera permission denied");
});

navigator.geolocation.getCurrentPosition(function(pos){

let lat=pos.coords.latitude;
let lon=pos.coords.longitude;

let dist=getDistance(lat,lon,OFFICE_LAT,OFFICE_LON);

if(dist<RADIUS){

document.getElementById("locationStatus").innerHTML="Location Approved";
locationApproved=true;

}else{

document.getElementById("locationStatus").innerHTML="Location Invalid";

}

});

function getDistance(lat1,lon1,lat2,lon2){

var R = 6371000;

var dLat = (lat2-lat1) * Math.PI/180;
var dLon = (lon2-lon1) * Math.PI/180;

var a =
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2);

var c = 2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

return R*c;

}

function capture(){

let canvas=document.getElementById("canvas");

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

canvas.getContext("2d").drawImage(video,0,0);

imageData=canvas.toDataURL("image/png");

let preview=document.getElementById("preview");

preview.src=imageData;
preview.style.display="block";

}

function submitAttendance(){

if(!locationApproved){

alert("Location not approved");
return;

}

if(!imageData){

alert("Capture selfie first");
return;

}

let employee=document.getElementById("employee").value;
let action=document.getElementById("action").value;

let now=new Date();

let time=now.toLocaleTimeString();
let date=now.toISOString().split('T')[0];

fetch("https://script.google.com/macros/s/AKfycbz5Db3EBpmrBj8el7ArjDFKrYPw9lALOJ0TvABrWMuWuifMGoETlhBgb1H8p6tApx5K/exec",{

method:"POST",

body:new URLSearchParams({

employee:employee,
action:action,
time:time,
date:date,
image:imageData

})

})

.then(res=>res.text())
.then(data=>{

let result=document.getElementById("result");

if(data.trim()=="ALREADY"){

result.innerHTML=employee+"<br>Your action is already submitted";

}else{

result.innerHTML=employee+"<br>Your action is submitted";

}

result.style.display="flex";

});

}

</script>

</body>
</html>
