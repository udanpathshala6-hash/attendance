<!DOCTYPE html>
<html>

<head>

<title>Attendance System</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{

background:white;
padding:30px;
width:360px;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,0.2);

}

h2{
text-align:center;
}

select,button{

width:100%;
padding:10px;
margin-top:10px;
border-radius:6px;
font-size:15px;

}

button{

background:#2ecc71;
border:none;
color:white;

}

video{

width:100%;
margin-top:10px;
border-radius:10px;

}

#preview{

width:100%;
margin-top:10px;

}

.status{

margin-top:10px;
font-size:14px;

}

</style>

</head>

<body>

<div class="box">

<h2>Employee Attendance</h2>

<select id="employee">

<option>Sagar Bala</option>
<option>Nikunja Ghosh</option>

</select>

<select id="action">

<option>Entry</option>
<option>Tiffin Exit</option>
<option>Tiffin Entry</option>
<option>Exit</option>

</select>

<video id="video" autoplay></video>

<button onclick="capture()">Capture Selfie</button>

<canvas id="canvas" style="display:none"></canvas>

<img id="preview">

<button onclick="submitAttendance()">Submit Attendance</button>

<div class="status" id="status"></div>

</div>

<script>

const OFFICE_LAT = 23.233491683380457;
const OFFICE_LON = 87.86578370663831;
const RADIUS = 100;

let latitude=null;
let longitude=null;
let imageData="";

const statusText=document.getElementById("status");

navigator.mediaDevices.getUserMedia({video:true})

.then(stream=>{
document.getElementById("video").srcObject=stream;
statusText.innerHTML="Camera Ready";
})

.catch(()=>{
statusText.innerHTML="Camera permission denied";
});

navigator.geolocation.getCurrentPosition(function(pos){

latitude=pos.coords.latitude;
longitude=pos.coords.longitude;

let dist = getDistance(latitude,longitude,OFFICE_LAT,OFFICE_LON);

if(dist > RADIUS){

alert("You are outside office location");
statusText.innerHTML="Location Invalid";

}else{

statusText.innerHTML="Location Verified";

}

});

function getDistance(lat1,lon1,lat2,lon2){

var R = 6371000;

var dLat = (lat2-lat1) * Math.PI/180;
var dLon = (lon2-lon1) * Math.PI/180;

var a =
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2);

var c = 2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

return R*c;

}

function capture(){

let video=document.getElementById("video");
let canvas=document.getElementById("canvas");

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

canvas.getContext("2d").drawImage(video,0,0);

imageData=canvas.toDataURL("image/png");

document.getElementById("preview").src=imageData;

}

function submitAttendance(){

if(!imageData){

alert("Capture selfie first");
return;

}

var employee=document.getElementById("employee").value;
var action=document.getElementById("action").value;

var now=new Date();

var time=now.toLocaleTimeString();
var date=now.toISOString().split('T')[0];

fetch("https://script.google.com/macros/s/AKfycbxZGo1168etcOG8aVu8gTT-F7f5WFihF4db2H_4CgOOKJB8UVF24EazZsali8gzF3b4/exec",{

method:"POST",

body:new URLSearchParams({

employee:employee,
action:action,
time:time,
date:date,
image:imageData

})

})

.then(res=>res.text())
.then(data=>{

alert("Attendance Submitted");

});

}

</script>

</body>

</html>
