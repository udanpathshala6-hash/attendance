<!DOCTYPE html>
<html>
<head>

<title>Attendance</title>

<style>

body{
font-family:Arial;
text-align:center;
margin-top:40px;
}

video{
width:300px;
border-radius:10px;
}

button{
padding:10px 20px;
margin-top:10px;
font-size:16px;
}

#msg{
margin-top:20px;
font-size:18px;
font-weight:bold;
}

</style>

</head>

<body>

<h2>Employee Attendance</h2>

<select id="emp">
<option>Sagar Bala</option>
<option>Nikunja Ghosh</option>
<option>Dipan</option>
<option>Jhuma Das</option>
</select>

<br><br>

<select id="action">
<option value="entry">Entry</option>
<option value="tiffin_exit">Tiffin Exit</option>
<option value="tiffin_entry">Tiffin Entry</option>
<option value="exit">Exit</option>
</select>

<br><br>

<video id="video" autoplay></video>

<br>

<button onclick="submitData()">Submit</button>

<p id="msg"></p>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbx4xEZjcom0ufZQZnHDQP-6zBs7oJfUNIehb9gO-6utuZn5MUtaScu2rPIGNUzPoptc/exec";

const video = document.getElementById("video");

navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{
video.srcObject = stream;
});

function submitData(){

var emp = document.getElementById("emp").value;
var action = document.getElementById("action").value;

var canvas = document.createElement("canvas");
canvas.width = video.videoWidth;
canvas.height = video.videoHeight;

var ctx = canvas.getContext("2d");
ctx.drawImage(video,0,0);

var image = canvas.toDataURL("image/jpeg");

var formData = new FormData();
formData.append("emp",emp);
formData.append("action",action);
formData.append("image",image);

fetch(scriptURL,{
method:"POST",
body:formData
})
.then(res=>res.text())
.then(data=>{

document.getElementById("msg").innerHTML =
"✅ Your attendance successfully submitted";

})
.catch(err=>{

document.getElementById("msg").innerHTML =
"❌ Submit Failed";

});

}

</script>

</body>
</html>
