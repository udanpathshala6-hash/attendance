<!DOCTYPE html>
<html>
<head>

<title>Attendance System</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding:40px;
}

.container{
background:white;
padding:30px;
border-radius:10px;
width:350px;
margin:auto;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

select,button{

width:100%;
padding:10px;
margin-top:10px;
border-radius:5px;
border:1px solid #ccc;
font-size:16px;

}

button{

background:#4CAF50;
color:white;
cursor:pointer;

}

button:hover{

background:#45a049;

}

video{

width:100%;
border-radius:10px;
margin-top:10px;

}

#preview{

margin-top:10px;
width:100%;
border-radius:10px;

}

</style>

</head>

<body>

<div class="container">

<h2>Employee Attendance</h2>

<select id="employee">

<option>Sagar Bala</option>
<option>Nikunja Ghosh</option>

</select>

<select id="action">

<option>Entry</option>
<option>Tiffin Exit</option>
<option>Tiffin Entry</option>
<option>Exit</option>

</select>

<video id="video" autoplay></video>

<button onclick="capture()">Capture Selfie</button>

<canvas id="canvas" style="display:none"></canvas>

<img id="preview">

<button onclick="submitData()">Submit Attendance</button>

</div>

<script>

const video=document.getElementById("video");

navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{

video.srcObject=stream;

});

var imageData="";

function capture(){

const canvas=document.getElementById("canvas");

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

canvas.getContext("2d").drawImage(video,0,0);

imageData=canvas.toDataURL("image/png");

document.getElementById("preview").src=imageData;

}

function submitData(){

var employee=document.getElementById("employee").value;
var action=document.getElementById("action").value;

var now=new Date();

var time=now.toLocaleTimeString();
var date=now.toISOString().split('T')[0];

fetch("https://script.google.com/macros/s/AKfycbxZGo1168etcOG8aVu8gTT-F7f5WFihF4db2H_4CgOOKJB8UVF24EazZsali8gzF3b4/exec",{

method:"POST",

body:new URLSearchParams({

employee:employee,
action:action,
time:time,
date:date,
image:imageData

})

})

.then(res=>res.text())
.then(data=>alert("Attendance Saved"))

}

</script>

</body>
</html>
