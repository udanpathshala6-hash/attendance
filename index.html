<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Attendance System</title>

<style>

body{
margin:0;
font-family:Segoe UI, sans-serif;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.card{

width:95%;
max-width:420px;
background:#111;
border-radius:15px;
padding:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.5);
text-align:center;

}

h2{
margin-top:5px;
}

select{

width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:none;
font-size:15px;
background:#1f2937;
color:white;

}

video{
width:220px;
height:220px;
margin:15px auto;
border-radius:50%;
border:4px solid #22c55e;
display:block;
object-fit:cover;
box-shadow:0 0 20px rgba(0,0,0,0.6);
}

#preview{
width:160px;
height:160px;
margin:15px auto;
border-radius:50%;
border:4px solid #22c55e;
display:none;
object-fit:cover;
}
  @keyframes zoomIn{

0%{transform:scale(0.5);opacity:0;}

100%{transform:scale(1);opacity:1;}

}

#result{

position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:none;
justify-content:center;
align-items:center;
text-align:center;
font-size:30px;
animation:zoomIn 0.5s ease;

}
button{

width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:10px;
font-size:16px;
background:#22c55e;
color:white;
cursor:pointer;

}

button:hover{

background:#16a34a;

}

.status{

margin-top:8px;
font-size:14px;

}

#result{

position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:none;
justify-content:center;
align-items:center;
text-align:center;
font-size:28px;

}

</style>

</head>

<body>

<div class="card">

<h2>Employee Attendance</h2>

<select id="employee">
<option>Select Name</option>
<option>Sagar Bala</option>
<option>Dipan</option>
<option>Jhuma Das</option>
<option>Nikunja Ghosh</option>
</select>

<select id="action">

<option>Entry</option>
<option>Tiffin Exit</option>
<option>Tiffin Entry</option>
<option>Exit</option>

</select>

<div id="locationStatus" class="status">
Checking location...
</div>

<video id="video" autoplay playsinline></video>

<img id="preview">

<button onclick="capture()">Capture Selfie</button>

<button onclick="submitAttendance()">Submit Attendance</button>

<canvas id="canvas" style="display:none"></canvas>

</div>

<div id="result"></div>

<script>

const OFFICE_LAT = 23.233464916200468;
const OFFICE_LON = 87.86576908748658;
const RADIUS = 100;

let imageData="";
let locationApproved=false;

const video=document.getElementById("video");

navigator.mediaDevices.getUserMedia({
video:{facingMode:"user"}
})
.then(stream=>{
video.srcObject=stream;
});

navigator.geolocation.getCurrentPosition(function(pos){

let lat=pos.coords.latitude;
let lon=pos.coords.longitude;

let dist=getDistance(lat,lon,OFFICE_LAT,OFFICE_LON);

if(dist<RADIUS){

document.getElementById("locationStatus").innerHTML="Location Approved";
locationApproved=true;

}else{

document.getElementById("locationStatus").innerHTML="Location Invalid";

}

});

function getDistance(lat1,lon1,lat2,lon2){

var R=6371000;

var dLat=(lat2-lat1)*Math.PI/180;
var dLon=(lon2-lon1)*Math.PI/180;

var a=
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2);

var c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

return R*c;

}

function capture(){

const canvas=document.getElementById("canvas");

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

canvas.getContext("2d").drawImage(video,0,0);

imageData=canvas.toDataURL("image/png");

let preview=document.getElementById("preview");

preview.src=imageData;
preview.style.display="block";

}

function submitAttendance(){

if(!locationApproved){

alert("Location not approved");
return;

}

if(!imageData){

alert("Capture selfie first");
return;

}

let employee=document.getElementById("employee").value;
let action=document.getElementById("action").value;

let now=new Date();

let time=now.toLocaleTimeString();
let date=now.toISOString().split('T')[0];

fetch("https://script.google.com/macros/s/AKfycbxJlwgrx-4zaLdKxbRUyMuNuZJxjfE6MmRqNo9X3Hu806HOCTUKefqBPlMst_K-L-Q-/exec",{

method:"POST",

body:new URLSearchParams({

employee:employee,
action:action,
time:time,
date:date,
image:imageData

})

})

.then(res=>res.text())
.then(data=>{

let result=document.getElementById("result");
if(data.trim()=="NAME_ERROR"){

result.innerHTML=
"❌ Name does not match";

}
  if(data.trim()=="ENTRY_REQUIRED"){

result.innerHTML="⚠ First action must be Entry";

}
if(data.trim()=="ALREADY"){

result.innerHTML=employee+"<br>⚠ Attendance Already Submitted";

}else{

result.innerHTML=
"✅ Attendance Recorded"+
"<br><br>Employee: "+employee+
"<br>Action: "+action+
"<br>Time: "+time+
  <br>+preview;
}

result.style.display="flex";

});

}

</script>

</body>
</html>
