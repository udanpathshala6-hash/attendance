<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>QR Attendance</title>

<style>

body{
font-family:Arial;
background:#f3f5f7;
padding:20px;
}

.container{
max-width:420px;
background:white;
margin:auto;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{text-align:center;}

select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:6px;
border:1px solid #ccc;
font-size:16px;
}

button{
background:#007bff;
color:white;
border:none;
cursor:pointer;
}

video{
width:100%;
margin-top:10px;
border-radius:8px;
}

canvas{display:none;}

.status{
margin-top:10px;
font-weight:bold;
text-align:center;
}

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:flex;
align-items:center;
justify-content:center;
}

.popup-box{
background:white;
padding:20px;
border-radius:10px;
text-align:center;
width:300px;
}

</style>

</head>

<body>

<div id="popup" class="popup">

<div class="popup-box">

<h3>Permission Required</h3>

<p>Camera and Location access required</p>

<button id="allowBtn">Allow Permission</button>

</div>

</div>

<div class="container">

<h2>Employee Attendance</h2>

<select id="name">

<option value="">Select Employee</option>
<option>Sagar Bala</option>
<option>Nikunja Ghosh</option>
<option>Dipan</option>
<option>Jhuma Das</option>

</select>

<select id="action">

<option value="">Select Action</option>
<option>Entry</option>
<option>Tiffin Exit</option>
<option>Tiffin Entry</option>
<option>Exit</option>

</select>

<button id="verifyBtn">📍 Verify Location</button>

<div id="locStatus" class="status">
Location Not Verified
</div>

<video id="video" autoplay playsinline></video>

<button id="selfieBtn">📷 Capture Selfie</button>

<canvas id="canvas"></canvas>

<button id="submitBtn" disabled>
Submit Attendance
</button>

<div id="msg" class="status"></div>

</div>

<script>

const officeLat=23.23347775561584
const officeLon=87.86578514123353
const allowedDistance=150

let imageData=""
let verified=false

const popup=document.getElementById("popup")
const allowBtn=document.getElementById("allowBtn")
const video=document.getElementById("video")
const verifyBtn=document.getElementById("verifyBtn")
const selfieBtn=document.getElementById("selfieBtn")
const submitBtn=document.getElementById("submitBtn")

allowBtn.addEventListener("click",async function(){

try{

const stream=await navigator.mediaDevices.getUserMedia({video:true})

video.srcObject=stream

navigator.geolocation.getCurrentPosition(()=>{},()=>{})

popup.style.display="none"

}catch(e){

alert("Permission denied")

}

})

function getDistance(lat1,lon1,lat2,lon2){

const R=6371

const dLat=(lat2-lat1)*Math.PI/180
const dLon=(lon2-lon1)*Math.PI/180

const a=
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2)

const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))

return R*c*1000

}

verifyBtn.addEventListener("click",function(){

navigator.geolocation.getCurrentPosition(function(pos){

let lat=pos.coords.latitude
let lon=pos.coords.longitude

let distance=getDistance(lat,lon,officeLat,officeLon)

if(distance<allowedDistance){

verified=true

document.getElementById("locStatus").innerHTML="✔ Location Verified"

submitBtn.disabled=false

}else{

document.getElementById("locStatus").innerHTML="❌ Outside Office"

}

},function(){

alert("Location permission denied")

})

})

selfieBtn.addEventListener("click",function(){

let canvas=document.getElementById("canvas")

canvas.width=video.videoWidth
canvas.height=video.videoHeight

canvas.getContext("2d").drawImage(video,0,0)

imageData=canvas.toDataURL("image/png")

alert("Selfie Captured")

})

submitBtn.addEventListener("click",function(){

let name=document.getElementById("name").value
let action=document.getElementById("action").value

if(name==""||action==""){

alert("Select employee and action")

return

}

if(imageData==""){

alert("Capture selfie first")

return

}

fetch("https://script.google.com/macros/s/AKfycbyKzS69m-xB4tEjIJu7gWBKS1nfk_ZZukxhTXm_SRZQvjNWRDkK3Euru-YjdaNTqf7H/exec",{

method:"POST",

body:JSON.stringify({

name:name,

action:action,

image:imageData

})

})
.then(res=>res.text())
.then(res=>{

document.getElementById("msg").innerHTML="✔ Attendance Submitted"

})

})

</script>

</body>
</html>
